{% assign post = include.post %}
{% assign counter = forloop.index | plus: 0 %}

<div class="archive__item">
  <p>
    [{{ counter }}] 
    {% if post.paperurl %}
      <a href="{{ post.paperurl }}">{{ post.citation | default: post.title }}</a>
    {% else %}
      <a href="{{ post.url | relative_url }}">{{ post.citation | default: post.title }}</a>
    {% endif %}
  </p>
</div>
